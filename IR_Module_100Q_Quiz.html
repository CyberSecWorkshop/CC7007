<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap');
:root{
  --bg:#f7f6f2;--card:#ffffff;--border:#dddbd4;
  --ok:#1a6b3c;--ok-bg:#edf7f1;--ok-bd:#a8d5bc;
  --no:#b01c1c;--no-bg:#fdf0f0;--no-bd:#f0b8b8;
  --rv:#1a5c6b;--rv-bg:#edf5f7;--rv-bd:#a8cfd8;
  --text:#1a1a1a;--muted:#7a7870;
  --mono:'IBM Plex Mono',monospace;
  --serif:'DM Serif Display',serif;
  --sans:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;padding:2.5rem 1rem 5rem;}
header{text-align:center;max-width:700px;margin:0 auto 2.5rem;border-bottom:1.5px solid var(--border);padding-bottom:1.8rem;}
.tag{display:inline-block;font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:.9rem;}
h1{font-family:var(--serif);font-size:clamp(1.8rem,4vw,2.8rem);font-weight:400;line-height:1.15;margin-bottom:.3rem;}
.sub{color:var(--muted);font-size:.82rem;font-family:var(--mono);}
.meta{max-width:700px;margin:.5rem auto;display:flex;justify-content:space-between;font-family:var(--mono);font-size:.68rem;color:var(--muted);}
.bar{max-width:700px;margin:0 auto 2rem;height:2px;background:var(--border);border-radius:1px;}
.fill{height:100%;background:var(--text);width:0%;transition:width .4s;}
.sec-hd{max-width:700px;margin:2rem auto .8rem;display:flex;align-items:center;gap:.8rem;}
.sec-lbl{font-family:var(--mono);font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:2px 8px;border:1px solid var(--border);border-radius:2px;white-space:nowrap;}
.sec-line{flex:1;height:1px;background:var(--border);}
.wrap{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:.9rem;}
.card{background:var(--card);border:1px solid var(--border);border-radius:5px;padding:1.3rem 1.4rem 1.3rem 1.6rem;position:relative;transition:border-color .2s;}
.card::before{content:'';position:absolute;left:0;top:0;width:3px;height:100%;background:var(--border);border-radius:5px 0 0 5px;transition:background .25s;}
.card.c-ok::before{background:var(--ok);}
.card.c-no::before{background:var(--no);}
.card.c-ok{border-color:var(--ok-bd);}
.card.c-no{border-color:var(--no-bd);}
.qnum{font-family:var(--mono);font-size:.58rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.5rem;}
.qtext{font-size:.94rem;font-weight:500;line-height:1.5;margin-bottom:.9rem;}
.opts{display:flex;flex-direction:column;gap:.4rem;}
.opt{display:flex;align-items:flex-start;gap:.65rem;padding:.6rem .85rem;border:1px solid var(--border);border-radius:4px;cursor:pointer;background:var(--bg);font-size:.85rem;color:var(--text);text-align:left;line-height:1.4;width:100%;transition:all .15s;font-family:var(--sans);}
.opt:hover:not(:disabled){border-color:var(--text);background:#f0efe9;}
.opt:disabled{cursor:default;}
.ltr{font-family:var(--mono);font-size:.62rem;color:var(--muted);min-width:1rem;padding-top:1px;flex-shrink:0;}
.opt.ok{border-color:var(--ok-bd);background:var(--ok-bg);color:var(--ok);}
.opt.ok .ltr{color:var(--ok);}
.opt.no{border-color:var(--no-bd);background:var(--no-bg);color:var(--no);}
.opt.no .ltr{color:var(--no);}
.opt.rv{border-color:var(--rv-bd);background:var(--rv-bg);color:var(--rv);}
.opt.rv .ltr{color:var(--rv);}
.fb{margin-top:.8rem;padding:.65rem .9rem;border-radius:3px;font-family:var(--mono);font-size:.72rem;line-height:1.6;display:none;border-left:3px solid;}
.fb.show{display:block;}
.fb.f-ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);}
.fb.f-no{border-color:var(--no);background:var(--no-bg);color:var(--no);}
.panel{max-width:700px;margin:2rem auto 0;background:var(--card);border:1px solid var(--border);border-radius:5px;padding:2.5rem 2rem;text-align:center;display:none;}
.panel.show{display:block;}
.big{font-family:var(--serif);font-size:4rem;font-weight:400;line-height:1;margin-bottom:.3rem;}
.plbl{color:var(--muted);font-size:.72rem;font-family:var(--mono);letter-spacing:.1em;margin-bottom:1.2rem;text-transform:uppercase;}
.badge{display:inline-block;padding:5px 18px;border-radius:3px;font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;margin-bottom:1.5rem;text-transform:uppercase;border:1px solid;}
.rbtn{background:var(--text);border:none;color:#fff;font-family:var(--mono);font-size:.72rem;padding:10px 26px;border-radius:3px;cursor:pointer;letter-spacing:.1em;transition:opacity .2s;text-transform:uppercase;}
.rbtn:hover{opacity:.75;}
</style>

<script>
const sections=[
  {"label":"IR Foundations","start":0},
  {"label":"Advanced IR & Threat Hunting","start":8},
  {"label":"Memory Forensics","start":15},
  {"label":"Timeline Analysis","start":27},
  {"label":"Network Traffic Analysis","start":35},
  {"label":"Malware Analysis","start":45},
  {"label":"IR Foundations — Extended","start":50},
  {"label":"Memory Forensics — Extended","start":60},
  {"label":"Timeline & Log Analysis — Extended","start":67},
  {"label":"Network Analysis — Extended","start":71},
  {"label":"Malware Analysis — Extended","start":80},
  {"label":"Applied Concepts","start":90}
];

const Q=[
  {q:"What term describes the time between an attacker gaining access and being detected?",o:["Mean time to respond to a confirmed alert","Dwell time","The breach detection and escalation interval","Incident response window"],a:1,e:"Dwell time is the number of days from when an adversary first gained access to when they were detected. Reducing it is a core goal of incident response."},
  {q:"Which IR phase covers lessons learned and program updates?",o:["Detection","Post-incident activity","Eradication","Containment"],a:1,e:"Post-incident activity is Phase 6 of the IR lifecycle. It covers lessons learned, reporting, and updating the IR program to prevent recurrence."},
  {q:"What is an 'event' in incident response?",o:["A confirmed breach that requires immediate CSIRT activation and escalation","A policy violation that must be reported to HR within 24 hours","Any observable occurrence like a log entry or alert","A scheduled penetration test authorised by senior management"],a:2,e:"An event is any observable occurrence — a log entry, alert, or user report. Most events are benign. A security incident is a subset of events indicative of malicious activity."},
  {q:"What is a playbook?",o:["The high-level IR policy signed off by the board of directors","A legal document authorising the CSIRT to take containment action","A directory of on-call contacts for the incident response team","Scenario-specific step-by-step guidance"],a:3,e:"A playbook operationalises the IR process for a specific scenario such as ransomware or phishing, providing step-by-step guidance. The IR plan is the high-level 'how we operate'."},
  {q:"Which is a Low severity incident?",o:["Attacker confirmed with domain administrator credentials","Active ransomware encrypting production file servers in real time","Single-PC malware infection","Confirmed exfiltration of regulated customer personal data"],a:2,e:"Low severity incidents include single-PC malware infections, lost encrypted laptops, and unauthorised software installations — events with limited scope and impact."},
  {q:"What is the danger of under-escalating alerts?",o:["CSIRT analysts experience burnout and lose credibility with leadership","Attacker operates longer and impact grows","Evidence is accidentally destroyed during rushed containment actions","Legal and regulatory obligations get triggered without proper preparation"],a:1,e:"Under-escalation allows the attacker to operate longer, expand their foothold, and cause greater damage. Escalation is an engineered decision system, not a vibe."},
  {q:"Which CSIRT role handles breach notification duties?",o:["The SOC analyst who first detected and triaged the alert","HR","Corporate Security","Legal"],a:3,e:"Legal falls under organisational support in the CSIRT. Their responsibilities include breach notification duties, liaising with external bodies, and litigation readiness."},
  {q:"How does an incident differ from an event?",o:["Events always originate externally while incidents are detected inside the network","An incident warrants coordinated response","Events are handled by the SOC while incidents are escalated to the board","There is no meaningful difference between the two terms in practice"],a:1,e:"An incident is a set of events indicative of malicious activity or policy violation that warrants a coordinated response to protect CIA and limit impact."},
  {q:"What is the first field in the SITREP template?",o:["What actions we are currently taking and who owns each task","What we know","What we need from leadership and other business teams","When the next update will be delivered to all stakeholders"],a:1,e:"The SITREP template requires: (1) what we know, (2) what we think, (3) what we're doing next, (4) what we need, and (5) when the next update arrives."},
  {q:"What does 'containment is a spectrum' mean?",o:["All containment decisions must be approved by the board before execution","Containment effectiveness should be rated on a numerical scale","Network, endpoint, and identity containment must all happen simultaneously","Pick the smallest reversible action that limits attacker options"],a:3,e:"Containment is not binary. Pick the smallest reversible action that changes adversary options — full isolation may destroy evidence or cause operational harm when a lighter action suffices."},
  {q:"What is operational root cause?",o:["A full forensic timeline with evidence chain suitable for court proceedings","Attribution of the attack to a specific named threat actor or nation state","Enough to stop the attacker coming back","A signed post-incident report reviewed and approved by the CISO"],a:2,e:"Operational root cause means knowing enough to close the initial access path, remove persistence, rotate credentials, and add detections. Goal: prevent re-entry."},
  {q:"A threat hunt finds nothing. What should happen?",o:["Escalate to the CISO and request additional analyst resources immediately","Document it — finding nothing proves coverage","Rerun the hunt using different tools until a finding is produced","File a report declaring the environment clean and close the investigation"],a:1,e:"If you find nothing, record it — it proves coverage. Always end with a follow-up: detection, fix, or risk acceptance. Finding nothing is a valid and valuable hunt outcome."},
  {q:"What makes an AAR valuable?",o:["It clearly documents who was responsible for the incident occurring","It satisfies mandatory regulatory and compliance reporting requirements","It drives real owned changes","It provides the evidence package needed to submit the insurance claim"],a:2,e:"The AAR is not just a report. Its value comes only when it drives concrete changes — process updates, new detections, tooling improvements — owned work with tests."},
  {q:"Where do threat hunt hypotheses come from?",o:["Automated alerts generated by the SIEM without analyst involvement","Help desk tickets submitted by end users about performance issues","TTPs, threat intel, and anomalies","Vendor security bulletins and software patch release documentation"],a:2,e:"A hunt hypothesis is a structured assumption derived from ATT&CK TTPs, threat intel reports, or observed anomalies — for example, 'if an attacker gained access, we'll see unusual admin role grants.'"},
  {q:"'One source of truth, one message, one cadence' applies to:",o:["How forensic evidence is collected and documented during investigation","How threat hunting findings are recorded and tracked across the team","Communications","How playbooks are versioned and updated after each real incident"],a:2,e:"During an incident, multiple people communicating different things creates chaos. One source of truth, one message, one cadence ensures consistent, accurate information reaches all stakeholders."},
  {q:"What can RAM reveal that a disk cannot?",o:["File creation and last-modified timestamps stored in the NTFS MFT","User account password hashes cached in the Windows SAM database","Active processes and injected code not saved to disk","The complete directory and folder structure of the operating system"],a:2,e:"RAM holds the live state of the machine. Running processes, decrypted keys, open network connections, and injected code all exist only in RAM and are lost when power is removed."},
  {q:"What is process hollowing?",o:["Injecting a DLL into a running process using the standard Windows loader","Overwriting a legitimate process's code with malicious payload","Creating a new malicious process with a name similar to a system process","Allocating executable memory inside a remote process without its knowledge"],a:1,e:"Process hollowing suspends a legitimate process, overwrites its code section (.text) with the attacker's payload, and resumes it. The file path in memory does not match the file on disk."},
  {q:"According to RFC 3227, what is collected first at an incident scene?",o:["A forensic image of the primary operating system disk volume","Server-based log files exported to a centralised collection system","NetFlow records from the core internal network switch infrastructure","RAM"],a:3,e:"RFC 3227 instructs responders to collect the most ephemeral data first. RAM is the most volatile — its contents vanish on power loss — and must be captured before any other evidence."},
  {q:"What does a PPID mismatch tell an investigator?",o:["The process is consuming an unusually high amount of system memory","The process is running with elevated SYSTEM-level account privileges","The process was launched by an unexpected parent","The process has significantly more threads than is normal for its type"],a:2,e:"Every process has a known expected parent. If the PPID is wrong for that process name — for example, cmd.exe parented by Word — it strongly suggests the process was spawned by malware."},
  {q:"MZ bytes in executable memory with no file on disk indicate:",o:["Memory corruption caused by a software defect or failing hardware","A standard Windows kernel module that was loaded during system boot","Injected code running from memory","The beginning of the process stack region allocated by the OS loader"],a:2,e:"4D 5A (MZ) are the magic bytes of a Windows PE file. Finding MZ at the start of an executable memory region with no corresponding file on disk indicates injected code — shellcode or a reflective DLL."},
  {q:"Why is fileless malware harder to detect?",o:["It uses military-grade encryption to conceal all network communications","It carefully mimics the names and behaviour of legitimate Windows processes","No file on disk for AV to scan","It rotates its command and control server infrastructure every few minutes"],a:2,e:"Fileless malware operates in memory with no persistent file on disk. Traditional file-based antivirus has nothing to scan. Detection requires memory forensics and behavioural monitoring."},
  {q:"When is a BitLocker key accessible in a RAM dump?",o:["Always: the key is permanently cached in a reserved RAM region","Only after the attacker has explicitly disabled BitLocker on the volume","Never: the hardware TPM chip prevents any RAM-based key extraction","When the machine is running with the volume mounted"],a:3,e:"When a BitLocker-protected volume is mounted and in use, the Volume Master Key is held in RAM to enable transparent decryption. A live RAM dump of a running, unlocked machine will contain this key."},
  {q:"A process starts at 3 AM on a finance workstation. Why is this suspicious?",o:["The operating system enforces a strict limit on overnight process creation","Finance workstations are configured to block all non-system processes overnight","Outside normal working hours","Processes running past midnight automatically trigger a security policy alert"],a:2,e:"A process starting at 3 AM on a finance workstation is anomalous because no legitimate user is working at that hour. Anomalous start times are a primary triage signal in memory forensics."},
  {q:"What does ESTABLISHED mean in netscan output?",o:["The socket is bound and waiting for an incoming connection request","The remote host refused the connection attempt with a TCP RST packet","Live traffic is actively flowing","Both sides have sent FIN packets and the session is fully closed"],a:2,e:"ESTABLISHED means the TCP three-way handshake completed and data is actively flowing. An ESTABLISHED connection from a suspicious process to an unknown external IP is a high-confidence C2 indicator."},
  {q:"Why do attackers target LSASS?",o:["It manages the internal routing tables used for network communication","It stores all application configuration data for software installed on the host","It holds credentials in memory for logged-on users","It is responsible for managing the BitLocker volume encryption key cache"],a:2,e:"LSASS manages Windows authentication and holds NTLM hashes, Kerberos tickets, and plaintext passwords in memory for all active sessions. Tools like Mimikatz target LSASS for credential extraction."},
  {q:"What does malfind identify?",o:["Processes whose parent PID does not match the expected system process tree","DLLs that have been loaded directly from remote UNC network share paths","Executable writable memory regions with no file backing","Any running process consuming more than ten percent of total available RAM"],a:2,e:"malfind identifies memory regions that are both executable and writable with no file-backed mapping — a pattern that should not exist for legitimate code. Injected shellcode and reflective DLLs have no file on disk."},
  {q:"A process is in psscan but not pslist. What does this mean?",o:["The process is a protected system component operating at the kernel level","The process terminated before the pslist scan completed its memory walk","The process started before the Windows session manager was initialised","It is hidden — a malware indicator"],a:3,e:"pslist reads the official OS process list which malware can manipulate. psscan reads raw memory structures directly. A process visible in psscan but absent from pslist is deliberately hidden — a key malware indicator."},
  {q:"A finding without a source is:",o:["Still valid if corroborated by a senior analyst with relevant case experience","Acceptable for internal-only reports but not for regulatory submission","Valid provided it is clearly marked as unverified in the incident log entry","An opinion, not evidence"],a:3,e:"Every timeline entry must have a source. A finding without a source is an opinion, not evidence. If you cannot explain your evidence path and decisions, your conclusions will not be trusted."},
  {q:"How is timestomping detected?",o:["Searching the Security Event Log for the presence of Event ID 1102","Comparing $SI and $FN timestamps","Running psscan and comparing the output line by line against pslist","Reviewing perimeter firewall deny logs for the relevant time window"],a:1,e:"Timestomping overwrites $STANDARD_INFORMATION ($SI) MACB timestamps. The $FILE_NAME ($FN) timestamps are set by the kernel and harder to modify. Comparing $SI and $FN exposes the forgery."},
  {q:"What does Event ID 1102 indicate?",o:["A new process was spawned on the system by a user or scheduled task","A user account successfully authenticated to the Windows domain controller","A scheduled task was registered in the Windows task scheduler database","The Security Event Log was cleared"],a:3,e:"Event ID 1102 records the exact time the Security Audit Log was cleared. It is the attacker's digital signature — the log has been tampered with, and the absence of earlier events is itself evidence."},
  {q:"Why normalise timestamps to UTC before building a timeline?",o:["GDPR mandates UTC formatting for all digital forensic evidence submissions","Courts in most jurisdictions will only accept UTC-formatted log timestamps","Clock skew can invert event ordering","Normalising to UTC significantly reduces the total storage size of log files"],a:2,e:"Machines drift and may be in different timezones. Even a 47-second drift can invert event ordering between two sources. Normalising to UTC before ordering prevents false sequencing."},
  {q:"What does a supertimeline include?",o:["Windows Event Logs and perimeter firewall logs from the incident period","NTFS MFT entries extracted from the forensic image of the primary disk","All available evidence sources in one chronological dataset","Memory artefacts produced by running Volatility plugins against the dump"],a:2,e:"A supertimeline uses Plaso to parse every available source — filesystem, Windows Event Logs, browser history, registry, network logs, memory — into one chronological dataset."},
  {q:"Many Event ID 4625s then one 4624 from the same IP indicates:",o:["A pass-the-hash attack using captured NTLM credential hashes from memory","DNS tunnelling being used to slowly exfiltrate authentication credentials","Brute-force-to-success","A large-scale credential stuffing campaign launched from a botnet network"],a:2,e:"Many failed logons (4625) followed by one success (4624) from the same source IP is the classic brute-force-to-success pattern. Timestamp the burst, then timestamp the success."},
  {q:"What does log injection leave behind?",o:["Absolutely no forensic evidence when carried out by a skilled attacker","Event ID 104 recorded in the Windows System Event Log channel","Record number gaps and hash mismatches","A newly created privileged user account visible in Active Directory logs"],a:2,e:"Log injection writes fake entries with fabricated timestamps. It leaves record number gaps, timestamps inconsistent with adjacent entries, and hash or signature mismatches on the log files."},
  {q:"Two sources disagree on a timestamp by 10 minutes. What should the analyst do?",o:["Always default to using the earlier of the two conflicting timestamps","Calculate and use the mathematical average of both recorded timestamps","Anchor to the reliable source and document the offset","Discard both conflicting sources entirely and rely on memory artefacts alone"],a:2,e:"A 1-second difference is likely clock skew. A 10-minute difference means one clock is wrong. Identify the reliable source, anchor to it, document the offset — never silently pick one."},
  {q:"What does NetFlow capture that firewall logs miss?",o:["Full application layer packet payload including POST body content","Complete request URLs with path parameters and query string values","East-west internal traffic","TLS certificate metadata exchanged during the client-server handshake"],a:2,e:"Firewall logs only see north-south perimeter traffic. NetFlow on internal switches captures east-west traffic between internal hosts — the only way to observe lateral movement without a full PCAP."},
  {q:"DNS tunnelling appears in logs as:",o:["Repeated standard A record queries resolving well-known public domains","Unusually large DNS response packets consistently originating from one IP","High volume TXT or NULL queries for long random subdomains","DNS queries being routed over port 80 to bypass firewall port restrictions"],a:2,e:"DNS tunnelling encodes data inside DNS queries and responses. It appears as high volume of TXT or NULL record queries for very long, random-looking subdomains."},
  {q:"What is a JA3 fingerprint used for?",o:["Generating a cryptographic hash of a PCAP file to verify its integrity","Recording the serial number embedded in the server TLS certificate chain","Combining source IP, destination IP, and port into a connection identifier","Fingerprinting client software from TLS handshake parameters"],a:3,e:"JA3 hashes TLS handshake parameters (cipher suites, extensions) which are unique to each client implementation. Known malware families have known JA3 fingerprints, enabling identification even when content is encrypted."},
  {q:"What is the C2 beaconing pattern in firewall logs?",o:["A single very large outbound data transfer to a previously unseen destination","High-volume inbound connections consistently arriving from many external IPs","Periodic ALLOW entries to the same external IP at regular intervals","A rapid burst of DENY entries targeting a wide sequential range of ports"],a:2,e:"C2 beaconing appears as regular, periodic ALLOW entries from one internal host to one external IP at low byte volume and consistent timing — the malware is checking in with its controller."},
  {q:"What characterises exfiltration in NetFlow records?",o:["Roughly equal byte counts flowing symmetrically in both directions over time","Very high inbound byte volume with comparatively minimal outbound traffic","All traffic confined exclusively to well-known DNS port 53 communications","Bytes sent far exceeding bytes received"],a:3,e:"Normal browsing involves more bytes received than sent. Exfiltration reverses this — bytes sent far exceed bytes received. A large outbound byte count to a new external destination is the primary indicator."},
  {q:"What is fast flux DNS?",o:["Encoding stolen data inside the long subdomain field of outbound DNS queries","Automatically generating and registering thousands of random domain names","Sending DNS queries at extremely high speed to exhaust the resolver cache","Rotating IPs behind a domain rapidly to defeat blocklists"],a:3,e:"Fast flux keeps the malicious domain constant but rotates the IP addresses behind it rapidly — sometimes every few minutes. Blocklists target IPs, so constant rotation defeats them."},
  {q:"Port 445 in forensic network logs most likely indicates:",o:["Standard encrypted HTTPS web browsing traffic to external destinations","Normal DNS name resolution queries sent to the internal recursive resolver","SMB — possible lateral movement or ransomware","Remote desktop protocol sessions being initiated by system administrators"],a:2,e:"Port 445 is SMB. It is used for Windows file sharing but is also the attack vector for lateral movement via PsExec, ransomware propagation across network shares, and credential relay attacks."},
  {q:"DGA traffic in DNS logs looks like:",o:["Long-TTL stable records that consistently resolve to one known IP address","Unusually large TXT record responses arriving repeatedly from one external IP","Flood of NXDOMAIN responses for nonsensical domains","Exclusively reverse PTR record queries resolving internal private IP addresses"],a:2,e:"DGA malware generates random domain names. Only one is the active C2 — the rest return NXDOMAIN. In DNS logs, DGA appears as a flood of NXDOMAIN responses for nonsensical domain names."},
  {q:"Which evidence tier captures full packet payload?",o:["Firewall logs","NetFlow","PCAP","Proxy access logs recording HTTP request metadata and response codes"],a:2,e:"PCAP captures every byte — headers, protocol handshakes, and complete payload if unencrypted. Firewall logs and NetFlow capture metadata only. Proxy logs capture URLs but not payload."},
  {q:"What does RITA specifically detect in PCAP data?",o:["Known malware samples identified through hash-based signature comparison","Anomalies in TLS certificate validity periods and certificate authority chains","DGA-generated domain names embedded in high-volume DNS query streams","C2 beaconing via statistical timing analysis"],a:3,e:"RITA detects C2 beaconing statistically. It analyses connection timing variance and frequency across the full capture — beaconing activity that might be 0.001% of a 24-hour PCAP is found without manual searching."},
  {q:"A binary has entropy of 7.98. What does this suggest?",o:["The binary carries a valid and trusted digital code-signing certificate","The file was produced by a standard commercial software development tool","It is a normal unmodified Windows system executable with no obfuscation","The file is likely packed or encrypted"],a:3,e:"Entropy near 8.0 (maximum) indicates the file's bytes are highly random — consistent with compression, encryption, or packing. Legitimate executables typically score 4–6."},
  {q:"Why do attackers pack malware?",o:["Packing significantly increases the speed at which the payload executes","To evade AV and hinder static analysis","Packing adds registry-based persistence mechanisms to the binary automatically","Packing reduces the network transfer time needed to deliver the payload"],a:1,e:"Packers use compression or encryption to wrap the malicious payload. The packed binary evades signature-based AV tools and resists static analysis because the actual malicious code is only revealed at runtime."},
  {q:"What does a YARA rule do?",o:["Monitors all live network connections for suspicious communication patterns","Automatically isolates and quarantines any infected endpoint device it finds","Scans files and memory for defined patterns","Decompiles and reconstructs readable source code from packed executables"],a:2,e:"YARA is pattern-based detection — 'grep for malware.' A rule defines conditions (hex sequences, strings, regex) and is run against files, memory dumps, or disk images to identify matching samples."},
  {q:"Why use ClamAV and Intezer together on the same sample?",o:["It is a mandatory requirement under the most common compliance frameworks","Running two tools simultaneously is significantly faster than running one alone","A sample evading one may be caught by the other","Together they completely eliminate false positives from the detection results"],a:2,e:"Each tool uses different detection approaches — signature matching, code genetics, behavioural analysis. A sample that evades one method may be caught by another, increasing confidence and reducing blind spots."},
  {q:"What is polymorphic malware?",o:["Malware that propagates automatically across network shares without user action","Malware that encrypts all victim files and displays a ransom payment demand","Malware that rewrites its own code with each infection","Malware that is delivered exclusively through targeted spear-phishing emails"],a:2,e:"Polymorphic malware rewrites its code with each infection cycle — changing byte sequences while preserving function — to defeat signature-based detection. Each copy has a different hash and pattern."},
  {q:"What is the purpose of the IR plan?",o:["To replace playbooks during major incidents","To list all known threat actors targeting the organisation","High-level guidance on how IR operates","To document forensic evidence handling procedures only"],a:2,e:"The IR plan is the high-level 'how we operate' — contacts, comms, classification, tracking, and maintenance cadence. Playbooks are the scenario-specific 'how we act'."},
  {q:"Which phase removes the attacker and restores trustworthy operations?",o:["Detection","Preparation","Containment","Eradication and Recovery"],a:3,e:"Eradication removes the adversary — persistence mechanisms, credentials, and access paths. Recovery restores trustworthy operations. Together they close the incident."},
  {q:"What is the role of a CSIRT charter?",o:["Defines containment procedures for each incident type","Lists all software tools available to analysts","Establishes mission, constituency, and service delivery","Sets out the evidence chain of custody process"],a:2,e:"The CSIRT charter is the founding document: it states the mission, defines the constituency (who is served), and specifies service delivery — proactive vs reactive services."},
  {q:"Which team member is typically first to detect and alert on an incident?",o:["Incident response coordinator","Legal counsel","Network architect","SOC analyst"],a:3,e:"The SOC analyst is the detection and alerting point in the CSIRT structure. They are typically first to identify anomalous activity and raise the alert that initiates the IR process."},
  {q:"What is the purpose of tabletop exercises?",o:["Train analysts on forensic tools in a lab environment","Test the IR plan without a real incident","Simulate live malware infections on isolated hosts","Audit the SIEM detection rule configuration"],a:1,e:"A tabletop exercise is discussion-based — the team walks through a hypothetical scenario, making decisions at each stage. It tests the plan and surfaces gaps without touching production systems."},
  {q:"What does the eradication phase involve?",o:["Notifying regulators of the breach","Capturing a RAM dump from affected hosts","Removing attacker access and restoring trust","Classifying the incident severity level"],a:2,e:"Eradication removes persistence (tasks, services, OAuth apps, IAM roles), rotates credentials, closes the initial access path, cleans staging hosts, and adds detections for observed behaviour."},
  {q:"What does a short dwell time tell us about an IR programme?",o:["Attacks are short and easy to detect","Detection capability is working — attackers are found quickly","Detection tools are generating too many false positives","Most incidents are resolved within a single shift"],a:1,e:"A short dwell time means the IR programme's detection capability is effective — attackers are being found quickly before they can cause significant damage or establish persistent access."},
  {q:"What should every IR plan include at minimum?",o:["A list of all known CVEs affecting the organisation","Network diagrams and asset inventories only","Contacts, classification criteria, and incident tracking process","The full forensic analysis methodology in detail"],a:2,e:"The IR plan must include: contacts and on-call lists, internal comms process, training schedule, maintenance cadence, incident classification scheme, and incident tracking approach."},
  {q:"Which IR lifecycle phase turns raw signals into a decision about severity?",o:["Preparation","Detection","Analysis","Eradication"],a:1,e:"The Detection phase turns raw signals — logs, alerts, user reports — into a decision: is this an incident, and how severe is it? It feeds directly into the Analysis phase."},
  {q:"What is the key risk of improvising during an incident response?",o:["Regulators are notified too early in the process","Evidence can be destroyed and the incident made worse","Analysts spend too long on containment actions","The attacker is alerted to the ongoing investigation"],a:1,e:"Improvisation during IR risks destroying evidence and making incidents worse. Good response contains, preserves evidence, and restores operations — improvisation can undermine all three."},
  {q:"In memory forensics, what does the order of volatility determine?",o:["Which logs are most reliable for timeline construction","Which evidence should be deleted after collection","The sequence in which evidence types should be collected","Which processes are most likely to be malicious"],a:2,e:"The order of volatility (from RFC 3227) determines collection sequence — most ephemeral first. RAM is collected before disk, disk before logs, logs before archives."},
  {q:"What is reflective DLL injection?",o:["Loading a DLL by name using the Windows loader API","Writing shellcode into a process then creating a remote thread","A DLL that loads itself from memory without the Windows loader","Overwriting the import address table of a running process"],a:2,e:"Reflective DLL injection uses a custom loader that maps the DLL entirely from memory, bypassing the Windows loader. The DLL does not appear in the process's standard loaded-library list."},
  {q:"What does the VAD (Virtual Address Descriptor) help identify in memory forensics?",o:["Network connections made by each process","The list of all user accounts on the system","Memory regions and their permissions per process","Loaded kernel drivers and their digital signatures"],a:2,e:"The VAD tree describes the virtual memory regions for each process — their address ranges, permissions (read/write/execute), and whether they are file-backed. malfind uses the VAD to find suspicious regions."},
  {q:"Why is svchost.exe commonly used by attackers as an injection target?",o:["It runs with the lowest privileges on the system","It is the only process that can make outbound network connections","It is a common legitimate process that blends in with normal activity","It has no security monitoring applied to it by default"],a:2,e:"svchost.exe is a generic host process for Windows services. Multiple legitimate instances run simultaneously, making it an ideal target for injection — malicious code blends into normal process listings."},
  {q:"What is atom bombing as a process injection technique?",o:["Suspending a thread and overwriting the instruction pointer register","Abusing GlobalAddAtom to write code and APC to execute it","Hollowing a process and injecting a portable executable file","Creating a remote thread in a target process with VirtualAllocEx"],a:1,e:"Atom bombing abuses the GlobalAddAtom function (part of the Windows atom table) to write code into another process, then uses an Asynchronous Procedure Call (APC) to execute it."},
  {q:"What does the $FN (FILE_NAME) attribute store in NTFS?",o:["The file content hash and metadata checksum","Timestamps modifiable by user-space tools","Timestamps set by the kernel — harder for attackers to modify","The file owner identity and access control list"],a:2,e:"The $FN attribute contains timestamps set by the NTFS kernel driver. Unlike $SI timestamps, $FN timestamps cannot easily be modified by user-space tools, making them a reliable reference for detecting timestomping."},
  {q:"What does MACB stand for in filesystem forensics?",o:["Malware, Access, Creation, Backup","Modified, Accessed, Changed, Born","Metadata, Audit, Checksum, Binary","Memory, Archive, Conflict, Baseline"],a:1,e:"MACB stands for Modified, Accessed, Changed (metadata changed), and Born (created). These four NTFS timestamps are the foundation of filesystem-based timeline analysis."},
  {q:"What Windows Event ID records the creation of a new process?",o:["4624","4625","4688","1102"],a:2,e:"Event ID 4688 (A new process has been created) records process creation events. It captures the process name, parent process, and the user account that launched it — essential for timeline and kill chain analysis."},
  {q:"What is the forensic significance of Event ID 4624 Type 3?",o:["Interactive desktop logon by a local user account","Network logon — possible indicator of lateral movement","Remote desktop logon initiated from an external IP address","Service account logon event triggered during system startup"],a:1,e:"Logon Type 3 is a network logon — authentication over the network rather than interactively at the console. In an IR investigation, Type 3 logons from unusual sources or at unusual times indicate lateral movement."},
  {q:"What does a 1-second timestamp discrepancy between two log sources most likely indicate?",o:["One source has been deliberately tampered with by the attacker","The logs originate from machines in different time zones","Normal clock skew between systems","The incident timeline cannot be reliably reconstructed"],a:2,e:"A 1-second difference between sources is typically normal clock skew — machines drift slightly. It is not a sign of tampering. A 10-minute difference, however, indicates a misconfigured or compromised clock."},
  {q:"Which Plaso filtering approach helps reduce millions of events to the relevant ones?",o:["Delete all events occurring outside normal business hours","Keep only Windows Event Logs and discard all other sources","Anchor to a known IOC timestamp and filter the window around it","Remove all duplicate events from different sources"],a:2,e:"The analyst anchors to a known IOC timestamp (±90 minutes) and filters to that window. Most intrusion activity clusters tightly around the initial compromise and lateral movement events."},
  {q:"What does TTL value in a network packet reveal about the sender?",o:["The encryption algorithm used for the connection","How long the current session has been active","A hint about the sender's operating system","The number of network hops remaining to the destination"],a:2,e:"TTL decrements at each router. The starting TTL value hints at the sender's OS — Windows defaults to 128, Linux to 64. Forensic analysis of TTL can help identify the attacker's platform."},
  {q:"What is ICMP tunnelling?",o:["Using ICMP to map the internal network topology","Sending ICMP floods to exhaust target bandwidth","Encoding exfiltrated data inside ICMP packet payloads","Routing TCP traffic through ICMP to bypass firewall rules"],a:2,e:"ICMP tunnelling encodes data inside ICMP echo (ping) packets. It is visible in a PCAP as ICMP packets with unusually large payloads — far larger than a normal ping response."},
  {q:"What does port 3389 indicate in network forensic logs?",o:["SMB file sharing and lateral movement activity","DNS query resolution traffic","RDP — possible interactive remote access","HTTPS encrypted web browsing traffic"],a:2,e:"Port 3389 is Remote Desktop Protocol. In forensic network logs, internal hosts initiating RDP sessions to servers — especially at unusual hours — is a key lateral movement indicator."},
  {q:"What does a proxy log record that a firewall log does not?",o:["Source and destination IP addresses of the connection","Byte counts and packet totals for the session","The full URL including domain and path","Whether the connection was allowed or denied by policy"],a:2,e:"A proxy log records the full URL including the domain and path — far more detail than a firewall log which only records IP and port. This is critical for identifying malware download URLs and C2 paths."},
  {q:"What does SNI (Server Name Indication) reveal in TLS traffic?",o:["The symmetric encryption key negotiated for the session","The destination domain name even within HTTPS traffic","The client's operating system and browser version","The total session duration and byte transfer count"],a:1,e:"SNI is sent unencrypted during the TLS handshake. It reveals the destination domain name even when the content is encrypted — allowing proxies and firewalls to record the domain without decrypting traffic."},
  {q:"What is a NetFlow record's most forensically valuable field?",o:["Source port","Packet count","Destination port","Flow duration in seconds"],a:2,e:"The destination port tells you what the connection is trying to do — 22=SSH, 445=SMB, 443=HTTPS, 3389=RDP. It is the primary field for classifying traffic type and assessing intent."},
  {q:"What does mergecap do?",o:["Splits a large PCAP into smaller time windows","Filters PCAP traffic by IP address or protocol","Combines multiple PCAP files into one chronologically sorted file","Converts PCAP files into NetFlow format for long-term storage"],a:2,e:"mergecap combines multiple PCAP files from different capture sources (tap, SPAN, VPN) into one chronologically sorted file for unified analysis. Bundled with Wireshark."},
  {q:"What does NetworkMiner's Files tab show?",o:["All DNS queries and responses captured in the session","Files reconstructed from HTTP traffic in the PCAP","All IP addresses and hostnames observed in the capture","TLS certificates extracted from the handshake process"],a:1,e:"The Files tab reconstructs files transferred over HTTP — showing frame number, hostname, content type, size, and filename. Extracted files can be immediately submitted to VirusTotal or a sandbox."},
  {q:"What makes C2 traffic over port 443 difficult to block?",o:["Port 443 cannot be deep-packet-inspected by standard firewalls","It blends in with normal HTTPS web traffic","It uses certificate pinning to prevent interception by proxies","It automatically rotates destination ports every few minutes"],a:1,e:"C2 over port 443 blends in with the massive volume of legitimate HTTPS web traffic. The content is encrypted, and the destination is one of many external IPs — making it hard to distinguish from normal browsing."},
  {q:"What is static malware analysis?",o:["Running malware in a controlled sandbox and recording its behaviour","Examining the binary code and properties without executing it","Comparing file hashes against threat intelligence databases","Monitoring all network traffic generated by the running malware"],a:1,e:"Static analysis examines the binary without running it — PE headers, strings, imports, entropy, disassembly. It is safer than execution but limited against packed or obfuscated samples."},
  {q:"What does PEStudio extract from a suspicious binary?",o:["Runtime network connections and DNS queries made during execution","Registry keys and values modified during malware execution","Metadata, embedded strings, imports, and PE structure without execution","Memory regions allocated by the process during execution"],a:2,e:"PEStudio performs static analysis — it extracts metadata, suspicious strings, import table (API calls), PE sections, entropy, and known indicators without executing the file."},
  {q:"What is a sandbox in malware analysis?",o:["A network segment completely isolated from the internet","A write-protected forensic disk image for safe evidence storage","An isolated environment designed to safely execute malware and observe behaviour","A copy of the production environment used for application testing"],a:2,e:"A sandbox is a controlled, isolated environment built so malware can be safely executed and its behaviour — process creation, network calls, file writes, registry changes — can be observed without risk."},
  {q:"What is the primary risk of executing malware on a production machine?",o:["The malware may consume excessive CPU and memory resources","It may spread and cause real operational damage","Antivirus tools will automatically quarantine it before analysis","The binary may fail to execute correctly outside a lab environment"],a:1,e:"Executing malware on a production machine risks it spreading to other hosts, encrypting data, establishing persistence, or exfiltrating sensitive information. Always use an isolated sandbox."},
  {q:"What does Intezer Analyze identify through genetic code analysis?",o:["Live network IOCs captured from active traffic during execution","Registry persistence keys created by the malware during runtime","Shared code segments between the sample and known malware families","Encrypted payloads concealed inside legitimate document files"],a:2,e:"Intezer's genetic analysis identifies code reuse between the sample and known malware families. A high percentage match means the sample is likely a variant of that family, even if the hash is different."},
  {q:"What does de4dot do?",o:["Unpacks PE executables that have been compressed with UPX packer","Extracts printable strings from a binary through static analysis","Deobfuscates and cleans up .NET malware","Automatically generates YARA rules from a provided malware sample"],a:2,e:"de4dot is a .NET deobfuscator. It removes obfuscation applied by common .NET packers and protectors, restoring readable code that can be analysed in a decompiler like dnSpy or ILSpy."},
  {q:"What is a Trojan in malware classification?",o:["Malware that replicates and spreads automatically across networks","Malware that encrypts victim files and demands a ransom payment","Malware disguised as legitimate software to trick the user into executing it","Malware that silently records keystrokes and sends them to the attacker"],a:2,e:"A Trojan disguises itself as legitimate software — a useful tool, game, or document — to trick the user into executing it. Unlike a virus or worm, it does not self-replicate."},
  {q:"What is the purpose of the import table in a PE file?",o:["Lists all functions the binary exports to other processes","Contains the malware's encrypted configuration data and C2 address","Lists the Windows API functions the binary imports and calls","Stores the digital code-signing certificate and signature chain"],a:2,e:"The import table lists all Windows API functions the binary calls. Imports like VirtualAllocEx, WriteProcessMemory, and CreateRemoteThread signal process injection capability — revealing capabilities without execution."},
  {q:"What does high entropy in a specific PE file section suggest?",o:["That section contains plain human-readable text strings","It is the standard read-only .data segment with initialised variables","That section is compressed or encrypted","The binary was compiled without speed optimisation flags"],a:2,e:"High entropy in a specific section (close to 8.0) suggests it contains compressed, encrypted, or packed data. This is often where the malware hides its real payload, decrypted and executed at runtime."},
  {q:"What is the key difference between a virus and a worm?",o:["Viruses encrypt files on infection; worms do not modify files","Worms only target Windows systems; viruses are cross-platform","A virus needs a host file to spread; a worm spreads independently","Viruses are detected by AV signatures; worms bypass all detection"],a:2,e:"A virus attaches itself to a host file and spreads when that file is executed. A worm is standalone and self-replicating — it spreads across networks by exploiting vulnerabilities without needing a host file."},
  {q:"What is chain of custody in digital forensics?",o:["The sequence in which different evidence source types are collected","A cryptographic hash computed over all collected evidence files","A documented record of who handled evidence and when","The legal warrant that authorises evidence collection at a scene"],a:2,e:"Chain of custody documents every person who accessed the evidence, every action taken, and every transfer between handlers. It ensures the evidence integrity can be demonstrated in legal or disciplinary proceedings."},
  {q:"What is the pivot rule in an IR investigation?",o:["Always begin with network evidence before examining endpoint data","Follow each suspicious artefact across all available evidence planes","Escalate every individual finding directly to the CSIRT lead","Require corroboration from at least three independent sources before acting"],a:1,e:"The pivot rule: every suspicious artefact should be followed across planes — user → host → process → network → cloud API → data access. This maps the full scope of the incident."},
  {q:"What does a CMDB help with during an incident?",o:["Automating containment actions directly on affected endpoints","Enriching security alerts with geolocation and reputation data","Tracking asset inventory, owners, and system relationships","Automatically generating YARA detection rules from observed IOCs"],a:2,e:"A CMDB (Configuration Management Database) tracks assets, their owners, dependencies, and relationships. During an incident it tells the IR team what other systems may be affected and who to notify."},
  {q:"What is Sigma in the context of threat detection?",o:["A memory forensics plugin framework similar to Volatility","A network traffic analysis and packet capture tool","A generic, vendor-neutral rule format for SIEM detections","A cloud-based sandbox platform for dynamic malware analysis"],a:2,e:"Sigma is a generic, open signature format for SIEM detection rules. A Sigma rule can be converted to queries for Splunk, Elastic, Microsoft Sentinel, and other SIEM platforms."},
  {q:"What is the purpose of enrichment during alert triage?",o:["To automatically close alerts that fall below a severity threshold","To add context that supports better triage decisions","To forward unresolved alerts to the next analyst tier","To generate a help desk ticket in the ITSM system automatically"],a:1,e:"Enrichment adds context to a raw alert — geolocation, threat intel reputation, asset criticality, user role — allowing the analyst to make a faster and more accurate triage decision."},
  {q:"What is a Pass-the-Hash attack?",o:["Cracking a stolen password hash offline using a wordlist attack","Stealing password hashes from a database and reselling them","Using a captured NTLM hash to authenticate without knowing the plaintext password","Intercepting a password hash in transit during a network authentication exchange"],a:2,e:"Pass-the-Hash uses a captured NTLM hash directly for authentication, bypassing the need to know the actual plaintext password. Tools like Mimikatz extract hashes from LSASS memory for this purpose."},
  {q:"What does Velociraptor provide in incident response?",o:["Static analysis capability for suspicious malware binaries","Network packet capture and protocol analysis at scale","Live endpoint interrogation and threat hunting across many hosts simultaneously","Automated generation of post-incident reports and executive summaries"],a:2,e:"Velociraptor is an endpoint visibility platform for live interrogation and hunting at scale. Analysts can run queries across thousands of endpoints simultaneously to identify IOCs, hunt for threats, and collect evidence."},
  {q:"What is the purpose of Sysmon in a Windows environment?",o:["Antivirus scanning and real-time quarantine of system executables","Firewall policy management and connection logging","Extended Windows event logging covering process creation, network connections, and file activity","Live memory acquisition from running endpoints for forensic analysis"],a:2,e:"Sysmon (System Monitor) extends Windows event logging with high-fidelity events: process creation with hashes, network connections, file creation, registry changes, and driver loading — essential for IR and threat hunting."},
  {q:"What does 'forensic/legal root cause' require beyond operational root cause?",o:["Full attribution of the attack to a named threat actor or nation state","A defensible evidence chain suitable for scrutiny in legal or regulatory proceedings","Board-level review and sign-off on all investigation findings","Regulatory pre-approval before the final report is published"],a:1,e:"Forensic/legal root cause requires a timeline with evidence, documented scope of data exposure, actions taken with rationale, and maintained chain of custody — all defensible under legal or regulatory scrutiny."},
  {q:"What is the key principle of evidence handling in IR?",o:["Collect as much data as possible before beginning any analysis work","Always reimage the affected host before collecting forensic evidence","Treat all evidence as if it may go to court","Only compute cryptographic hashes when litigation has been formally confirmed"],a:2,e:"Whether or not legal proceedings are anticipated, treat all evidence as if it might go to court. If you cannot explain your evidence path and decisions, your conclusions will not be trusted."}
];

const total=Q.length,L=['A','B','C','D'];
let answered=0,score=0,shuffled=[];
function shuffle(arr){return arr.slice().sort(()=>Math.random()-.5);}
function build(){
  document.getElementById('sub').textContent=total+' questions · IR & Digital Forensics revision bank ';
  const w=document.getElementById('wrap');
  w.innerHTML='';answered=0;score=0;upd();
  shuffled=shuffle(Q).map(q=>{
    const idx=q.o.map((_,i)=>i);
    const order=shuffle(idx);
    const newOpts=order.map(i=>q.o[i]);
    const newAns=order.indexOf(q.a);
    return{q:q.q,o:newOpts,a:newAns,e:q.e};
  });
  shuffled.forEach((q,i)=>{
    const c=document.createElement('div');c.className='card';c.id='c'+i;
    c.innerHTML='<div class="qnum">Q'+String(i+1).padStart(2,'0')+' / '+total+'</div>'+
      '<div class="qtext">'+q.q+'</div>'+
      '<div class="opts">'+q.o.map((o,j)=>
        '<button class="opt" onclick="pick('+i+','+j+')">'+
        '<span class="ltr">'+L[j]+'</span><span>'+o+'</span></button>').join('')+
      '</div><div class="fb" id="f'+i+'"></div>';
    w.appendChild(c);
  });
  document.getElementById('panel').classList.remove('show');
}
function pick(qi,oi){
  const q=shuffled[qi],c=document.getElementById('c'+qi),fb=document.getElementById('f'+qi);
  c.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const ok=oi===q.a;
  c.querySelectorAll('.opt')[oi].classList.add(ok?'ok':'no');
  if(!ok)c.querySelectorAll('.opt')[q.a].classList.add('rv');
  c.classList.add(ok?'c-ok':'c-no');
  fb.className='fb show '+(ok?'f-ok':'f-no');
  fb.innerHTML=(ok?'✓ Correct':'✗ Incorrect')+' — '+q.e;
  if(ok)score++;answered++;upd();
  if(answered===total)setTimeout(finish,600);
}
function upd(){
  document.getElementById('prog').textContent=answered+' / '+total+' answered';
  document.getElementById('sc').textContent='Score: '+score;
  document.getElementById('fill').style.width=((answered/total)*100)+'%';
}
function finish(){
  const pct=Math.round(score/total*100);
  document.getElementById('bigscore').textContent=score+'/'+total;
  const b=document.getElementById('badge');
  let g,bg,bd,cl;
  if(pct>=90){g='Excellent — A';bg='#edf7f1';bd='#a8d5bc';cl='#1a6b3c';}
  else if(pct>=75){g='Good — B';bg='#edf0f7';bd='#a8b5d8';cl='#1a306b';}
  else if(pct>=60){g='Pass — C';bg='#fdf8ed';bd='#d8c88a';cl='#6b4e1a';}
  else{g='Needs Revision';bg='#fdf0f0';bd='#f0b8b8';cl='#b01c1c';}
  b.textContent=g;b.style.background=bg;b.style.borderColor=bd;b.style.color=cl;
  document.getElementById('panel').classList.add('show');
  document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'center'});
}
function reset(){build();window.scrollTo({top:0,behavior:'smooth'});}
build();
</script>
